name: wordtrail-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://${MYSQL_HOST:-shop-system-db}:3306/${MYSQL_DATABASE:-word_trail_db}?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-wordtrail}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set a Base64-encoded random key of at least 32 bytes in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      SENTENCE_EDITOR_USER_IDS: ${SENTENCE_EDITOR_USER_IDS:-}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      SMS_DAILY_LIMIT: ${SMS_DAILY_LIMIT:-10}
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-100}
      PIPER_URL: ${PIPER_URL:-http://host.docker.internal:5000}
      PIPER_US_VOICE: ${PIPER_US_VOICE:-en_US-lessac-medium}
      PIPER_UK_VOICE: ${PIPER_UK_VOICE:-en_GB-alan-medium}
      SERVER_PORT: "8080"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - database
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health/ready]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

networks:
  database:
    external: true
    name: ${MYSQL_NETWORK:-wordtrail-db}
