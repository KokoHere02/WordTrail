services:
  web:
    build:
      context: ${WORDTRAIL_WEB_DIR:?Set WORDTRAIL_WEB_DIR}
      dockerfile: ${WORDTRAIL_DEPLOY_DIR:?Set WORDTRAIL_DEPLOY_DIR}/frontend.Dockerfile
    restart: unless-stopped
    environment:
      WEB_SERVER_NAME: ${WEB_SERVER_NAME:-_}
      NGINX_ENVSUBST_FILTER: "^WEB_SERVER_NAME"
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - "${WORDTRAIL_DEPLOY_DIR:?Set WORDTRAIL_DEPLOY_DIR}/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - database
