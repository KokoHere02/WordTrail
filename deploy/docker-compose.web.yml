services:
  web:
    build:
      context: ${WORDTRAIL_WEB_DIR:?Set WORDTRAIL_WEB_DIR}
      dockerfile: ${WORDTRAIL_DEPLOY_DIR:?Set WORDTRAIL_DEPLOY_DIR}/frontend.Dockerfile
    restart: unless-stopped
    environment:
      WEB_SERVER_NAME: ${WEB_SERVER_NAME:-_}
      WEB_TLS_DIRECTIVES: ${WEB_TLS_DIRECTIVES:-}
      NGINX_ENVSUBST_FILTER: "^(WEB_SERVER_NAME|WEB_TLS_DIRECTIVES)"
    ports:
      - "${WEB_PORT:-80}:80"
      - "443:443"
    volumes:
      - "${WORDTRAIL_DEPLOY_DIR:?Set WORDTRAIL_DEPLOY_DIR}/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro"
      - "${TLS_CERT_DIR:-${WORDTRAIL_DEPLOY_DIR}}:/etc/nginx/tls:ro"
      - "${ACME_WEBROOT:-${WORDTRAIL_DEPLOY_DIR}}:/var/www/acme:ro"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - database
