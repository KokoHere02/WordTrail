spring:
  application:
    name: wordtrail
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/word_trail_db?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:wordtrail}
    access-ttl: ${JWT_ACCESS_TTL:30m}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}


mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
