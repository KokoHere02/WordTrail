spring:
  application:
    name: wordtrail
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/word_trail_db?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 256KB
      max-request-size: 300KB

server:
  port: ${SERVER_PORT:8080}

app:
  audio:
    piper-url: ${PIPER_URL:http://localhost:5000}
    piper-us-voice: ${PIPER_US_VOICE:en_US-lessac-medium}
    piper-uk-voice: ${PIPER_UK_VOICE:en_GB-alan-medium}
  sentence:
    editor-user-ids: ${SENTENCE_EDITOR_USER_IDS:}
  jwt:
    secret: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:wordtrail}
    access-ttl: ${JWT_ACCESS_TTL:30m}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:7d}
  sms:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:恒创联众}
    daily-limit: ${SMS_DAILY_LIMIT:10}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    daily-limit: ${MAIL_DAILY_LIMIT:100}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}


mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
