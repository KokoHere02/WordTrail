name: Verify WordTrail
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse backup scripts and reject invalid backups without database access
        shell: pwsh
        run: ./scripts/Test-BackupScripts.ps1
  h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - run: mvn -B -DargLine=-XX:TieredStopAtLevel=1 verify
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Initialize isolated MySQL database
        env:
          MYSQL_PWD: ci-only-password
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          schema="wordtrail_daily_verify_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          docker exec -e MYSQL_PWD "$MYSQL_CONTAINER" mysql -u root -e "CREATE DATABASE $schema CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          docker exec -i -e MYSQL_PWD "$MYSQL_CONTAINER" mysql -u root "$schema" < src/main/resources/db/init.sql
          echo "WORDTRAIL_MYSQL_TEST_SCHEMA=$schema" >> "$GITHUB_ENV"
          echo "DB_URL=jdbc:mysql://127.0.0.1:3306/$schema?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai" >> "$GITHUB_ENV"
      - name: Verify all application tests with MySQL
        run: mvn -B -Dspring.profiles.active=mysql-test -DargLine=-XX:TieredStopAtLevel=1 verify
